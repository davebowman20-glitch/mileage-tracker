<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bowman Decor - Mileage Tracker</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #2a2a2a;
      --accent-color: #ff9800;
      --text-color: #ffffff;
      --text-secondary: #b0b0b0;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-top: 12px;
    }

    .title-area h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .current-odometer {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .current-odometer span {
      color: var(--text-color);
      font-weight: 600;
    }

    .logo {
      height: 48px;
      width: auto;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    input, select {
      width: 100%;
      padding: 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    input::placeholder {
      color: #666;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background-color: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }

    .status-msg.success {
      background-color: #1b5e20;
      color: #a5d6a7;
      display: block;
    }

    .status-msg.error {
      background-color: #b71c1c;
      color: #ef9a9a;
      display: block;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="title-area">
        <h1>Log a Trip</h1>
        <div class="current-odometer">
          Current odometer: <span id="latestOdo">Loading...</span>
        </div>
      </div>
      <img src="logo.png" alt="Bowman Decor" class="logo" onerror="this.style.display='none'">
    </div>

    <form id="mileageForm">
      <div class="form-group">
        <label for="odometer">Odometer Reading</label>
        <input 
          type="number" 
          id="odometer" 
          name="odometer" 
          placeholder="e.g. 110060" 
          required 
          inputmode="numeric"
        >
      </div>

      <div class="form-group">
        <label for="reason">Reason for Travel</label>
        <select id="reason" name="reason" required>
          <option value="" disabled selected>Select a reason...</option>
          <option value="Commute">Commute</option>
          <option value="Materials Pickup">Materials Pickup</option>
          <option value="Site Visit">Site Visit</option>
          <option value="Personal">Personal</option>
        </select>
      </div>

      <div class="form-group">
        <label for="jobsite">Jobsite / Destination</label>
        <input 
          type="text" 
          id="jobsite" 
          name="jobsite" 
          placeholder="e.g. 17 Wynforte Lodge - Moira" 
          required
        >
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">Log Trip</button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    // ⚠️ REPLACE THIS WITH YOUR NEW GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHcfeFIti7WDgwjQBapirqoOwizFKhICdj69nEow3QbT_PDknZ5DVUn02sS1alEv3r/exec";

    const form = document.getElementById('mileageForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    const latestOdo = document.getElementById('latestOdo');

    // Fetch last odometer reading on load
    window.addEventListener('DOMContentLoaded', () => {
      if (!SCRIPT_URL || SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
        latestOdo.textContent = "URL not set";
        return;
      }

      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if (data && data.latestOdometer) {
            latestOdo.textContent = Number(data.latestOdometer).toLocaleString() + " mi";
          } else {
            latestOdo.textContent = "Ready";
          }
        })
        .catch(() => {
          latestOdo.textContent = "Ready";
        });
    });

    // Form submission handler
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      // Lock UI
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';
      statusMsg.className = 'status-msg';
      statusMsg.style.display = 'none';

      const formData = new URLSearchParams();
      formData.append('odometer', document.getElementById('odometer').value);
      formData.append('reason', document.getElementById('reason').value);
      formData.append('jobsite', document.getElementById('jobsite').value);

      // no-cors fetch prevents redirection/CORS hangs on mobile
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: formData
      })
      .then(() => {
        // Success state
        statusMsg.textContent = 'Trip logged successfully!';
        statusMsg.className = 'status-msg success';
        
        // Reset form
        form.reset();
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log Trip';

        // Refresh page after 1.5 seconds to pull updated mileage
        setTimeout(() => {
          location.reload();
        }, 1500);
      })
      .catch(err => {
        console.error('Error logging trip:', err);
        statusMsg.textContent = 'Failed to submit. Please check your connection.';
        statusMsg.className = 'status-msg error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log Trip';
      });
    });
  </script>
</body>
</html>
